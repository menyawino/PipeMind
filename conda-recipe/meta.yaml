{% set name = "pipemind" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}


source:
  path: ..

  noarch: python
  script: pip install .

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10
    - pyyaml >=6.0.1
    - pydantic >=2.7
    - fastapi >=0.110
    - uvicorn >=0.30
    - typer >=0.12
    - rich >=13.7
    - networkx >=3.3
    - snakemake >=8.11
    - fastmcp >=0.4.1
    - httpx >=0.27
    - openai >=1.0.0

test:
  imports:
    - pipemind
  commands:
    - pipemind --help

  home: https://github.com/menyawino/PipeMind
  dev_url: https://github.com/menyawino/PipeMind
  doc_url: https://github.com/menyawino/PipeMind#readme
  summary: Convert Snakemake workflows into agent-usable bioinformatics tools and composition plans
  description: |
    PipeMind converts Snakemake workflows into an agent-usable bioinformatics toolset. It compiles compatible workflows into a typed registry, exposes rules as MCP tools, records agent-readiness diagnostics for dynamic rules, and materializes minimal Snakemake execution plans for requested goal artifacts.
  license: Apache-2.0
  license_family: Apache
  license_file: ../LICENSE
  identifiers:
    - biotools:pipemind
# Extra: Bioconda/Conda-forge channel info (for PR)
# To submit to Bioconda, fork https://github.com/bioconda/bioconda-recipes and add this recipe under recipes/pipemind/
# Add to meta.yaml:
extra:
  recipe-maintainers:
    - menyawino
